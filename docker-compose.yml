version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb+srv://shenalkahagalla00_db_user:Dm9oSG6jNAQmdgIe@cluster0.psvtskw.mongodb.net/?appName=Cluster0
      - JWT_SECRET=super_secret_jwt_key_for_flavor_dash_2024
      - JWT_EXPIRE=30d
      - CLIENT_URL=http://localhost:5173
      - ADMIN_URL=http://localhost:5174
      - KITCHEN_URL=http://localhost:5175
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  kitchen:
    build:
      context: ./kitchen
      dockerfile: Dockerfile
    ports:
      - "5175:5175"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    volumes:
      - ./kitchen:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
